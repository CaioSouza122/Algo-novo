<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Document</title>
</head>
<body>
     <script src="{{ url_for('static', filename='js/script.js') }}"></script> <!--Linkando o Script JS com o Back (Deixando aqui pq rodava rapido d+)-->
   <!--Criando Site de Chamados de Suporte Técnico-->
   <div class ="container">
    <h1>Suporte Técnico</h1>
    <form id="supportForm" action="/submit" method="post" enctype="multipart/form-data"><!--Adicionando enctype para Suporte de Upload de Arquivo e Linkando com o Back-->
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="issue">Descrição do Problema:</label>
        <textarea id="issue" name="issue" rows="4" required></textarea>

        <!--Adicionando Funçaõ de Anexar imagem-->
        <label for="attachment">Anexar Imagem:</label>
        <input type="file" id="attachment" name="attachment" accept="image/*">

        <button type="submit">Enviar</button>
       
        <button id="clearButton" type="reset">Limpar</button>
    </form>
    <div id="response"></div>
    </div>
    

</body>
</html>
